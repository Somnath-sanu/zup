services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: zup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zupuser
      POSTGRES_PASSWORD: zuppass123
      POSTGRES_DB: zup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zupuser -d zup"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zup-network

  #INNGEST
  inngest:
    image: inngest/inngest:latest
    container_name: zup-inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    command: 'inngest dev -u http://app:3000/api/inngest'
    networks:
      - zup-network    

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shanudev/zup:v1
    container_name: zup-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://zupuser:zuppass123@postgres:5432/zup
      
      # Clerk Authentication
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}

      #Inngest
      INNGEST_DEV: "true"
      INNGEST_BASE_URL: http://inngest:8288
      
      # E2B Sandbox
      E2B_API_KEY: ${E2B_API_KEY}
      
      # Google AI
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Firecrawl
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      
      # Application
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zup-network

volumes:
  postgres_data:
    driver: local

networks:
  zup-network:
    driver: bridge
